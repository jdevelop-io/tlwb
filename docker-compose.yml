services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: tlwb
      POSTGRES_PASSWORD: tlwb
      POSTGRES_DB: tlwb
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tlwb"]
      interval: 5s
      timeout: 5s
      retries: 10

  collab-server:
    build:
      context: .
      dockerfile: apps/collab-server/Dockerfile
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://tlwb:tlwb@postgres:5432/tlwb
      CORS_ORIGIN: http://localhost:5173
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres-data:
