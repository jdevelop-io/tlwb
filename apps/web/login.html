<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>tlwb</title>
    <link rel="icon" href="/favicon.svg" />
    <link rel="stylesheet" href="/src/styles/tokens.css" />
    <link rel="stylesheet" href="/src/styles/ui.css" />
  </head>
  <body>
    <div class="login-page">
      <a class="logotype" href="/">
        <span style="font-size: 34px; line-height: 34px">tlwb</span>
        <svg width="60" height="8" viewBox="0 0 60 8" aria-hidden="true">
          <path d="M2 5.5 C 16 2.5, 31 6.5, 58 3.5" fill="none" stroke="var(--color-accent)" stroke-width="3" stroke-linecap="round" />
        </svg>
      </a>
      <div class="card">
        <h1>Sign in</h1>
        <button id="github" type="button" class="button-secondary oauth-button">
          Continue with GitHub
        </button>
        <button id="google" type="button" class="button-secondary oauth-button">
          Continue with Google
        </button>
      </div>
    </div>
    <script type="module" src="/src/login/main.ts"></script>
  </body>
</html>
