  <text x="628" y="312" text-anchor="middle" font-family="Caveat, cursive" font-weight="700" font-size="30" fill="#1A1A1A">api</text>

  <path d="M910,300 Q900,260 955,262 Q1040,252 1050,300 Q1058,350 985,352 Q902,354 910,300 Z"
