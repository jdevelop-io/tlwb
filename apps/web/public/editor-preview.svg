  </defs>

  <rect x="0" y="0" width="1200" height="720" fill="#FFFFFF" />
  <rect x="1" y="1" width="1198" height="718" fill="none" stroke="#E5E4E0" stroke-width="2" />

  <rect x="440" y="24" width="320" height="56" rx="12" fill="#FFFFFF" stroke="#E5E4E0" stroke-width="2" />
  <circle cx="474" cy="52" r="14" fill="none" stroke="#1A1A1A" stroke-width="2" />
  <circle cx="518" cy="52" r="14" fill="#FFE1D9" stroke="#FF6B4A" stroke-width="2" />
  <circle cx="562" cy="52" r="14" fill="none" stroke="#1A1A1A" stroke-width="2" />
  <circle cx="606" cy="52" r="14" fill="none" stroke="#1A1A1A" stroke-width="2" />
  <circle cx="650" cy="52" r="14" fill="none" stroke="#1A1A1A" stroke-width="2" />
  <circle cx="694" cy="52" r="14" fill="none" stroke="#1A1A1A" stroke-width="2" />
  <circle cx="726" cy="52" r="14" fill="none" stroke="#1A1A1A" stroke-width="2" />

  <path d="M170,300 Q160,260 210,262 Q330,250 340,300 Q350,350 260,352 Q160,354 170,300 Z"
