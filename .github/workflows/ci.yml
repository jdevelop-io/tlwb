name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify on Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The minimum the workspace declares, and the current Active LTS.
        node: [22, 24]
    steps:
      - uses: actions/checkout@v7

      # Installs pnpm (version taken from the root package.json
      # "packageManager") and the runtime in a single step.
      - uses: pnpm/setup@v2
        with:
          runtime: node@${{ matrix.node }}
          cache: true
          # Installing explicitly below keeps the frozen-lockfile guarantee
          # visible instead of relying on pnpm's CI default.
          install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test
